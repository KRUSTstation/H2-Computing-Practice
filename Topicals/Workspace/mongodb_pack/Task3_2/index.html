<!DOCTYPE html>
<html>

<body>

<table>
<tr>
    <th>Item Name</th>
    <th>Description</th>
    <th>Category</th>
    <th>Date Lost</th>
    <th>Location</th>
    <th>Recovered</th>
</tr>

{% for i in data %}
    <tr>
        <td>{{i['item_name']}}</td>
        <td>{{i['description']}}</td>
        <td>{{i['category']}}</td>
        <td>{{i['date_lost']}}</td>
        <td>{{i['location']}}</td>
        <td>{{i['recovered']}}</td>
    </tr>
{% endfor %}
</table>

</body>

</html>
