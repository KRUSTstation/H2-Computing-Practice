<!DOCTYPE html>
<html>

<head>
    <title>Cubicle Availability on {{ date }}</title>
</head>

<body>
    <center>
    <h1>Cubicle Availability on {{ date }}</h1>

    <table border="1" style="width: 200px; border: 1px;border-collapse:collapse;">
        {% for i in cubicles %}
            <tr>
                <th>{{i[0]}}</th>
                {% if i[0] in valid %}
                    <th>Available</th>
                {% else %}
                    <th>Unavailable</th>
                {% endif %}
            </tr>
        {% endfor %}
    </table>
    </center>
</body>

</html>
