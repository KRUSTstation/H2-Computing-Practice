<!DOCTYPE html>
<html>

<body>

<h1>List of Concerts</h1>
<table border="1">
    <tr>
        <th>Concert Name</th>
        <th>Artist</th>
        <th>Date</th>
        <th>Price</th>
        <th>Quantity of Tickets</th>
    </tr>

    {% for item in data %}
        <tr>
            <td>{{item[0]}}</td>
            <td>{{item[1]}}</td>
            <td>{{item[2]}}</td>
            <td>{{item[3]}}</td>
            <td>{{item[4]}}</td>
        </tr>
    {% endfor %}
</table>

</body>

</html>
