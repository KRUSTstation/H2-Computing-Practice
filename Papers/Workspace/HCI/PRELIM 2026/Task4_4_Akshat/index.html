<!DOCTYPE html>
<html>

<body>

<table border="1">
    <tr>
        <th>Queue ID</th>
        <th>Priority</th>
        <th>Name</th>
        <th>Age</th>
        <th>Gender</th>
    </tr>

    {% for i in data %}
        <tr>
            <td>{{i[0]}}</td>
            <td>{{i[1]}}</td>
            <td>{{i[2]}}</td>
            <td>{{i[3]}}</td>
            <td>{{i[4]}}</td>
        </tr>
    {% endfor %}
</table>

</body>

</html>
